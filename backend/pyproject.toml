[project]
name = "vehrep-backend"
version = "2.0.0"
description = "Vehicle Report v2 backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1.5",
    "pillow>=11.0",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "apscheduler>=3.11",
]

[project.optional-dependencies]
ml = [
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "rapidocr-onnxruntime>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP042"]
